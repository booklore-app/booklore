name: BookLore Maintenance Request
description: Suggest a focused maintenance improvement for BookLore
title: "[Maintenance] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## BookLore is in maintenance mode

        Active feature development has moved to [BookOrbit](https://bookorbit.app), the official successor to BookLore. Please submit new feature ideas to the [BookOrbit issue tracker](https://github.com/bookorbit/bookorbit/issues/new/choose).

        Use this form only for a small, focused BookLore maintenance improvement. Bug reports should use the bug report form.

  - type: textarea
    id: description
    attributes:
      label: What maintenance improvement are you proposing?
      description: Describe the focused improvement and why it belongs in maintenance-mode BookLore rather than BookOrbit.
      placeholder: "Describe the existing BookLore behavior and the limited improvement you are proposing."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What existing problem would this address?
      description: Explain the impact on current BookLore installations.
      placeholder: "Explain the current limitation and who it affects."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything Else? (Optional)
      description: Feel free to add screenshots, mockups, examples from other apps, or implementation ideas
      placeholder: |
        You might want to include:
        - Screenshots or mockups showing what you envision
        - Examples from other apps you like (Goodreads, StoryGraph, etc.)
        - Ideas for how it could work (progress bars, page counters, etc.)
        - Alternative approaches you've thought about

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Want to help?
      description: Let us know if you can help implement or verify this maintenance improvement.
      options:
        - "Yes! I'd love to help implement this improvement"
        - "I'm happy to help test and give feedback"
        - "Just sharing the idea for now"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have You Considered Any Alternatives? (Optional)
      description: Are there other ways to achieve what you want? Tell us about them

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      description: Please confirm both items.
      options:
        - label: I've searched existing issues and confirmed this maintenance improvement has not already been requested.
          required: true
        - label: I understand that new feature development has moved to BookOrbit.
          required: true
